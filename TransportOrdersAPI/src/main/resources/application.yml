server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transportdb}
    username: ${DB_USER:transport}
    password: ${DB_PASSWORD:transport}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  upload-dir: ${UPLOAD_DIR:uploads}
  auth:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:development-secret-change-this-before-deploying-12345678901234567890}
