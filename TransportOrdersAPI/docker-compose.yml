services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transportdb
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transport}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transportdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/transportdb
      DB_USER: transport
      DB_PASSWORD: ${DB_PASSWORD:-transport}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-this-before-deploying-12345678901234567890}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  uploads:
